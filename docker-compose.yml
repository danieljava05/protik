# Local development dependencies. Add services here only when a ticket needs them.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: protik
      POSTGRES_USER: protik
      POSTGRES_PASSWORD: protik   # development only
    ports:
      - "5432:5432"
    volumes:
      - protik-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U protik -d protik"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  protik-pgdata:
