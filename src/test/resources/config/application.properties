# Test overrides, merged over src/main/resources/application.properties.
# The job worker is off by default so tests control job state; tests that
# need it switch it on with @SpringBootTest(properties = ...).
protik.jobs.enabled=false
# Other suites register and fail logins constantly from one address; ThrottleIntegrationTests
# sets realistic limits for itself.
protik.throttle.login-pair-limit=100000
protik.throttle.login-account-limit=100000
protik.throttle.login-ip-limit=100000
protik.throttle.register-ip-limit=100000
# Many differently configured contexts stay cached in one test run; small pools keep the total under
# PostgreSQL's default 100 connections.
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
