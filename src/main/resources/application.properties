spring.application.name=protik

# Database. Defaults match docker-compose.yml and are for local development
# only; real deployments must set DB_URL, DB_USER and DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/protik}
spring.datasource.username=${DB_USER:protik}
spring.datasource.password=${DB_PASSWORD:protik}

# Migrations run per module (shared/migration/ModuleMigrations), not via Boot's
# single-instance Flyway.
spring.flyway.enabled=false

# Correlation ID in every log line (set by shared/web/CorrelationIdFilter).
logging.pattern.correlation=[%X{correlationId:-}]

# Errors are RFC 9457 problem documents from GlobalExceptionHandler; never leak internals.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Expose only what operations need; everything else stays off by default.
management.endpoints.web.exposure.include=health,info

# OpenAPI: generated, /v1 only, no bundled UI (the backend is the product).
springdoc.api-docs.path=/v3/api-docs
springdoc.paths-to-match=/v1/**
springdoc.swagger-ui.enabled=false

# Persistent event registry (ADR 0002, ADR 0015): the table is created by Flyway in the shared schema.
spring.modulith.events.jdbc.schema=shared
spring.modulith.events.jdbc.schema-initialization.enabled=false
# Handled events are deleted (the feed's read models are rebuildable, so no audit trail is needed) and
# events whose listener did not finish before a crash are delivered again at startup.
spring.modulith.events.completion-mode=delete
spring.modulith.events.republish-outstanding-events-on-restart=true

# Feed (ADR 0015): protik.feed.pool-size, window, default-limit, max-limit.

# Comments (ADR 0017): protik.social.comments-per-window, comment-window, default-page-size, max-page-size.

# Sessions and refresh tokens (ADR 0012): protik.session.refresh-token-ttl, max-age, reuse-grace.

# Rate limits (ADR 0013): protik.throttle.login-pair-limit, login-account-limit, login-ip-limit,
# login-window, register-ip-limit, register-window.

# Uploads and processing (ADR 0022): protik.storage.root, protik.upload.max-bytes, max-duration, per-hour,
# protik.scan.mode (clamd | disabled), protik.scan.host, port, protik.ffmpeg.path, probe-path, timeout, threads.
# Scanning is ON by default: with no ClamAV reachable nothing is published. disabled is for development only.

# Security (ADR 0011). Set JWT_SECRET (32+ bytes) in any real deployment.
protik.security.jwt-secret=${JWT_SECRET:}
protik.security.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
